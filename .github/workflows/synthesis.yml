name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize async_stream_fifo
        run: yosys -Q -T -p 'read_verilog -sv rtl/async_stream_fifo.sv; hierarchy -check -top async_stream_fifo; synth -top async_stream_fifo; stat'
